name: Axiom VR Mod – Build ARM64 .so

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: Android ARM64 (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Dear ImGui v1.90.4
        run: git clone --depth 1 --branch v1.90.4 https://github.com/ocornut/imgui.git imgui

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK r26c
        run: |
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip -d $HOME
          echo "ANDROID_NDK=$HOME/android-ndk-r26c" >> $GITHUB_ENV

      - name: Configure (CMake + NDK toolchain)
        run: |
          cmake -S . -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_arm64 --config Release --parallel $(nproc)

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaxiom_vr_mod-arm64-v8a
          path: build_arm64/libaxiom_vr_mod.so
          if-no-files-found: error

  build-linux-desktop:
    name: Linux Desktop (smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Dear ImGui v1.90.4
        run: git clone --depth 1 --branch v1.90.4 https://github.com/ocornut/imgui.git imgui

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libglfw3-dev libgl1-mesa-dev libgles2-mesa-dev

      - name: Configure
        run: cmake -S . -B build_linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_linux --config Release --parallel $(nproc)

      - name: Upload desktop example
        uses: actions/upload-artifact@v4
        with:
          name: axiom_example-linux
          path: build_linux/axiom_example
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build-android-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: libaxiom_vr_mod-arm64-v8a
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libaxiom_vr_mod.so
          body: |
            ## Axiom VR Mod – ${{ github.ref_name }}
            Animated orange-green gradient ImGui overlay for VR modding.
            [made by TagtusVR]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
